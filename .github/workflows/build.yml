name: Build UltimateMiniPanel APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'UltimateMiniPanel_Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Extract source ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o UltimateMiniPanel_Source.zip -d extracted
          find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Find project directory
        id: project
        shell: bash
        run: |
          PROJECT_FILE="$(find extracted -type f -name settings.gradle -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          fi

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: ZIP-এর মধ্যে settings.gradle পাওয়া যায়নি"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" \
            assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltimateMiniPanel-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
